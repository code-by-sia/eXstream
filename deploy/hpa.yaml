# Horizontal Pod Autoscalers for the stateless components.
#
# auth, playlist, and file are intentionally NOT autoscaled: they persist
# data as flat files on ReadWriteOnce volumes, so they must run as a
# single replica. Move their storage to a shared backend before scaling.
#
# Requires the cluster metrics-server for CPU utilization metrics.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forward-auth
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
    app.kubernetes.io/component: forward-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forward-auth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
