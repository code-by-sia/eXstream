# Image names assume a registry prefix you control; build and push them
# first (see deploy/README.md) or substitute your own references.
#
# auth, playlist, and file are pinned to 1 replica because they persist
# data on ReadWriteOnce volumes. web and forward-auth are stateless and
# scale horizontally via the HPAs in hpa.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exstream
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exstream
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/code-by-sia/exstream-auth:latest
          ports:
            - name: http
              containerPort: 4001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: exstream-jwt
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-data
---
