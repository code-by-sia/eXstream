apiVersion: apps/v1
kind: Deployment
metadata:
  name: forward-auth
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
    app.kubernetes.io/component: forward-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exstream
      app.kubernetes.io/component: forward-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exstream
        app.kubernetes.io/component: forward-auth
    spec:
      containers:
        - name: forward-auth
          image: ghcr.io/code-by-sia/exstream-forward-auth:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: exstream-jwt
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exstream
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exstream
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/code-by-sia/exstream-web:latest
          ports:
            - name: http
              containerPort: 7001
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: web-nginx
