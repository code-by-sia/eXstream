# The JWT signing secret shared by the auth service (issues tokens)
# and forward-auth (verifies tokens at the ingress).
#
# Override the value before applying, or create it directly:
#   kubectl -n exstream create secret generic exstream-jwt \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: exstream-jwt
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
type: Opaque
stringData:
  JWT_SECRET: change-me
