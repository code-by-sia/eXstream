# Traefik routing, translated from api/dynamic.yml to the Traefik
# Kubernetes CRDs (IngressRoute + Middleware). Requires Traefik v3 with
# the kubernetesCRD provider enabled (k3s ships this out of the box).
#
# The bearer-auth middleware delegates token verification to the
# forward-auth service, which answers 204 with X-Username/X-Role headers
# that Traefik copies onto the upstream request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bearer-auth
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
spec:
  forwardAuth:
    address: http://forward-auth.exstream.svc.cluster.local:3000/verify
    trustForwardHeader: true
    authResponseHeaders:
      - X-Username
      - X-Role
---
# All API traffic is published under /api; this strips the prefix before
# forwarding so the services keep their unprefixed routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: exstream
  namespace: exstream
  labels:
    app.kubernetes.io/name: exstream
spec:
  entryPoints:
    - web
  routes:
    # Public auth endpoints: register, login, verify. Password changes and
    # user administration sit under the protected /api/auth prefix.
    - kind: Rule
      match: PathPrefix(`/api/auth/register`) || PathPrefix(`/api/auth/login`) || PathPrefix(`/api/auth/verify`)
      priority: 100
      middlewares:
        - name: strip-api
      services:
        - name: auth
          port: 4001

    # Everything else under /api/auth requires a valid bearer token.
    - kind: Rule
      match: PathPrefix(`/api/auth`)
      priority: 90
      middlewares:
        - name: bearer-auth
        - name: strip-api
      services:
        - name: auth
          port: 4001

    # File upload.
    - kind: Rule
      match: Path(`/api/file`) && Method(`POST`)
      priority: 120
      middlewares:
        - name: bearer-auth
        - name: strip-api
      services:
        - name: file
          port: 6001

    # File reads, updates, deletes, and listing.
    - kind: Rule
      match: PathPrefix(`/api/file`) || PathPrefix(`/api/files`)
      priority: 80
      middlewares:
        - name: bearer-auth
        - name: strip-api
      services:
        - name: file
          port: 6001

    # Playlist CRUD and music search.
    - kind: Rule
      match: PathPrefix(`/api/playlists`) || PathPrefix(`/api/playlist/search`) || PathPrefix(`/api/music/search`)
      priority: 80
      middlewares:
        - name: bearer-auth
        - name: strip-api
      services:
        - name: playlist
          port: 5001

    # The SPA catches everything else.
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - name: web
          port: 7001
