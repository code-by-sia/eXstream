services:
  traefik:
    image: traefik:v3.3
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - ./api/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./api/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - auth
      - file
      - playlist
      - web
      - forward-auth

  forward-auth:
    build: ./api
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret}

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    ports:
      - "4001:4001"
    volumes:
      - ./data/auth:/app/data

  playlist:
    build:
      context: .
      dockerfile: playlist/Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./data/playlist:/app/data

  file:
    build:
      context: .
      dockerfile: file/Dockerfile
    ports:
      - "6001:6001"
    volumes:
      - ./data/file:/app/data

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "7001:7001"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  # Distributed tracing collector + UI. Ready to receive spans at
  # http://zipkin:9411/api/v2/spans — see common/monitoring/README.md for why
  # the Xi services don't report to it directly yet.
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  # Scrapes each Xi service's Prometheus-format GET /metrics (see
  # common/monitoring/prometheus-exporter.xi).
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - auth
      - playlist
      - file

volumes:
  web-node-modules:
