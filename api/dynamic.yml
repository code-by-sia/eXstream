http:
  middlewares:
    bearer-auth:
      forwardAuth:
        address: http://forward-auth:3000/verify
        trustForwardHeader: true
        authResponseHeaders:
          - X-Username
          - X-Role
    # All API traffic is published under /api; strip it before forwarding so
    # the services keep their unprefixed routes (/auth, /playlists, /file).
    strip-api:
      stripPrefix:
        prefixes:
          - /api

  routers:
    auth-public:
      rule: PathPrefix(`/api/auth/register`) || PathPrefix(`/api/auth/login`) || PathPrefix(`/api/auth/verify`)
      service: auth
      middlewares:
        - strip-api
      entryPoints:
        - web
      priority: 100

    auth-protected:
      rule: PathPrefix(`/api/auth`)
      service: auth
      middlewares:
        - bearer-auth
        - strip-api
      entryPoints:
        - web
      priority: 90

    file-upload:
      rule: Path(`/api/file`) && Method(`POST`)
      service: file
      middlewares:
        - bearer-auth
        - strip-api
      entryPoints:
        - web
      priority: 120

    file:
      rule: PathPrefix(`/api/file`) || PathPrefix(`/api/files`)
      service: file
      middlewares:
        - bearer-auth
        - strip-api
      entryPoints:
        - web
      priority: 80

    playlist:
      rule: PathPrefix(`/api/playlists`) || PathPrefix(`/api/playlist/search`) || PathPrefix(`/api/music/search`)
      service: playlist
      middlewares:
        - bearer-auth
        - strip-api
      entryPoints:
        - web
      priority: 80

    web:
      rule: PathPrefix(`/`)
      service: web
      entryPoints:
        - web
      priority: 1

  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth:4001

    file:
      loadBalancer:
        servers:
          - url: http://file:6001

    playlist:
      loadBalancer:
        servers:
          - url: http://playlist:5001

    web:
      loadBalancer:
        servers:
          - url: http://web:7001
